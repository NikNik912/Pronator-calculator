<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Дневник & Калькулятор 1ПМ</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #121212;
      color: #e0e0e0;
      padding: 16px;
      max-width: 500px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
      padding-top: 10px;
    }
    h1 {
      color: #ff9800;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .nav-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      background: #1e1e1e;
      padding: 4px;
      border-radius: 10px;
      border: 1px solid #2d2d2d;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 4px;
      background: transparent;
      border: none;
      color: #888;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: #2a2a2a;
      color: #ff9800;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    .card {
      background: #1e1e1e;
      border-radius: 14px;
      padding: 20px;
      border: 1px solid #2d2d2d;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      color: #a0a0a0;
      font-size: 14px;
      margin-bottom: 8px;
    }
    input, select {
      width: 100%;
      background: #2a2a2a;
      border: 1px solid #3d3d3d;
      border-radius: 10px;
      padding: 14px;
      color: #ffffff;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus {
      border-color: #ff9800;
    }
    input::placeholder {
      color: #666;
    }
    .btn-primary {
      width: 100%;
      background: #ff9800;
      color: #000000;
      border: none;
      border-radius: 10px;
      padding: 15px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-primary:active {
      transform: scale(0.98);
      background: #e68a00;
    }
    .result-box {
      margin-top: 20px;
      text-align: center;
      min-height: 36px;
    }
    .result-text {
      color: #00e676;
      font-size: 22px;
      font-weight: 700;
    }
    .anatomy-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .anatomy-svg {
      width: 100%;
      max-width: 280px;
      height: auto;
      background: #121212;
      border-radius: 10px;
      padding: 10px;
    }
    .muscle-group {
      fill: #333333;
      stroke: #555555;
      stroke-width: 1.5;
      transition: fill 0.3s;
      cursor: pointer;
    }
    .muscle-group.active {
      fill: #ff9800;
    }
    .muscle-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 10px;
    }
    .legend-tag {
      background: #2a2a2a;
      border: 1px solid #3d3d3d;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      color: #ccc;
      cursor: pointer;
    }
    .legend-tag.active {
      background: #ff9800;
      color: #000;
      font-weight: bold;
      border-color: #ff9800;
    }
    .log-item {
      background: #2a2a2a;
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 4px solid #ff9800;
    }
    .log-info h4 {
      color: #fff;
      font-size: 15px;
      margin-bottom: 4px;
    }
    .log-info p {
      color: #aaa;
      font-size: 13px;
    }
    .del-btn {
      background: transparent;
      border: none;
      color: #ff5252;
      font-size: 18px;
      cursor: pointer;
      padding: 4px;
    }
    footer {
      margin-top: auto;
      text-align: center;
      padding: 15px 0 5px;
      color: #555;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Дневник & Калькулятор 1ПМ</h1>
  </header>

  <nav class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('calc-tab')">Калькулятор</button>
    <button class="tab-btn" onclick="switchTab('workout-tab')">Дневник</button>
    <button class="tab-btn" onclick="switchTab('anatomy-tab')">Анатомия</button>
  </nav>

  <!-- Вкладка Калькулятора -->
  <main id="calc-tab" class="tab-content active">
    <div class="card">
      <div class="form-group">
        <label for="weight">Вес отягощения (кг)</label>
        <input type="number" id="weight" placeholder="Например: 20" step="0.5" inputmode="decimal">
      </div>
      <div class="form-group">
        <label for="reps">Количество повторений</label>
        <input type="number" id="reps" placeholder="Например: 15" inputmode="numeric">
      </div>
      <button class="btn-primary" onclick="calculate1RM()">Рассчитать 1ПМ</button>
      
      <div class="result-box">
        <div id="result" class="result-text"></div>
      </div>
    </div>
  </main>

  <!-- Вкладка Дневника -->
  <main id="workout-tab" class="tab-content">
    <div class="card">
      <h3 style="color:#ff9800; margin-bottom:14px; font-size:16px;">Записать подход</h3>
      <div class="form-group">
        <label for="ex-name">Упражнение</label>
        <input type="text" id="ex-name" placeholder="Подъём на пронатор / Подтягивания">
      </div>
      <div style="display:flex; gap:10px;">
        <div class="form-group" style="flex:1;">
          <label for="ex-weight">Вес (кг)</label>
          <input type="number" id="ex-weight" placeholder="20">
        </div>
        <div class="form-group" style="flex:1;">
          <label for="ex-reps">Повторы</label>
          <input type="number" id="ex-reps" placeholder="15">
        </div>
      </div>
      <div class="form-group">
        <label for="ex-muscle">Целевая мышца</label>
        <select id="ex-muscle">
          <option value="forearms">Предплечье / Пронатор / Кисть</option>
          <option value="biceps">Бицепс / Плечелучевая</option>
          <option value="delts">Плечи / Дельты</option>
          <option value="back">Спина / Широчайшие</option>
          <option value="chest">Грудь</option>
          <option value="legs">Ноги</option>
        </select>
      </div>
      <button class="btn-primary" onclick="addLogEntry()">Сохранить запись</button>
    </div>

    <div class="card">
      <h3 style="color:#ff9800; margin-bottom:14px; font-size:16px;">История подходов</h3>
      <div id="log-list">
        <p style="color:#666; text-align:center; font-size:14px;">История пока пуста</p>
      </div>
    </div>
  </main>

  <!-- Вкладка Анатомии -->
  <main id="anatomy-tab" class="tab-content">
    <div class="card anatomy-container">
      <h3 style="color:#ff9800; font-size:16px;">Карта нагруженных мышц</h3>
      <p style="color:#a0a0a0; font-size:13px; text-align:center;">Нажмите на группы мышц для визуализации уровня нагрузки</p>
      
      <svg class="anatomy-svg" viewBox="0 0 200 380">
        <!-- Голова -->
        <circle cx="100" cy="35" r="20" fill="#333" stroke="#555" stroke-width="1.5" />
        <!-- Шея -->
        <rect x="94" y="55" width="12" height="15" fill="#333" stroke="#555" stroke-width="1.5" />
        <!-- Плечи / Дельты -->
        <path class="muscle-group delts" d="M 60,70 Q 75,68 88,72 L 85,95 L 60,85 Z" />
        <path class="muscle-group delts" d="M 140,70 Q 125,68 112,72 L 115,95 L 140,85 Z" />
        <!-- Грудь -->
        <path class="muscle-group chest" d="M 88,72 Q 100,74 112,72 L 112,110 Q 100,115 88,110 Z" />
        <!-- Пресс / Кор -->
        <path class="muscle-group core" d="M 88,112 Q 100,115 112,112 L 108,160 Q 100,165 92,160 Z" />
        <!-- Бицепс / Руки -->
        <path class="muscle-group biceps" d="M 58,87 L 72,92 L 68,125 L 52,120 Z" />
        <path class="muscle-group biceps" d="M 142,87 L 128,92 L 132,125 L 148,120 Z" />
        <!-- Предплечья / Пронаторы / Кисти -->
        <path class="muscle-group forearms" d="M 50,122 L 66,127 L 58,165 L 44,158 Z" />
        <path class="muscle-group forearms" d="M 150,122 L 134,127 L 142,165 L 156,158 Z" />
        <!-- Квадрицепсы / Ноги -->
        <path class="muscle-group legs" d="M 82,165 Q 100,168 100,168 L 96,260 L 78,255 Z" />
        <path class="muscle-group legs" d="M 118,165 Q 100,168 100,168 L 104,260 L 122,255 Z" />
        <!-- Икры -->
        <path class="muscle-group legs" d="M 78,265 L 94,268 L 90,340 L 78,335 Z" />
        <path class="muscle-group legs" d="M 122,265 L 106,268 L 110,340 L 122,335 Z" />
      </svg>

      <div class="muscle-legend">
        <span class="legend-tag" onclick="toggleMuscle('forearms')">Предплечья / Пронатор</span>
        <span class="legend-tag" onclick="toggleMuscle('biceps')">Бицепс</span>
        <span class="legend-tag" onclick="toggleMuscle('delts')">Дельты</span>
        <span class="legend-tag" onclick="toggleMuscle('chest')">Грудь</span>
        <span class="legend-tag" onclick="toggleMuscle('back')">Спина</span>
        <span class="legend-tag" onclick="toggleMuscle('legs')">Ноги</span>
      </div>
    </div>
  </main>

  <footer>
    <p>1ПМ Дневник &copy; 2026 PWA</p>
  </footer>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW зарегистрирован:', reg.scope))
          .catch(err => console.log('Ошибка SW:', err));
      });
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      const activeBtn = Array.from(document.querySelectorAll('.tab-btn')).find(btn => btn.getAttribute('onclick').includes(tabId));
      if (activeBtn) activeBtn.classList.add('active');
    }

    window.addEventListener('DOMContentLoaded', () => {
      const hash = window.location.hash.replace('#', '');
      if (hash && document.getElementById(hash)) {
        switchTab(hash);
      }
      renderLogs();
    });

    function calculate1RM() {
      const w = parseFloat(document.getElementById('weight').value);
      const r = parseInt(document.getElementById('reps').value);
      const resultDiv = document.getElementById('result');

      if (!w || !r || w <= 0 || r <= 0) {
        resultDiv.innerHTML = '<span style="color:#ff5252; font-size:15px;">Введите корректные данные</span>';
        return;
      }

      let rm = 0;
      if (r === 1) {
        rm = w;
      } else {
        rm = w * (1 + r / 30);
      }

      const roundedRM = Math.round(rm);
      resultDiv.innerHTML = `Ваш 1ПМ: ~${roundedRM} кг`;
    }

    function getLogs() {
      return JSON.parse(localStorage.getItem('1pm_workout_logs') || '[]');
    }

    function saveLogs(logs) {
      localStorage.setItem('1pm_workout_logs', JSON.stringify(logs));
    }

    function addLogEntry() {
      const name = document.getElementById('ex-name').value.trim() || 'Упражнение';
      const weight = parseFloat(document.getElementById('ex-weight').value) || 0;
      const reps = parseInt(document.getElementById('ex-reps').value) || 0;
      const muscle = document.getElementById('ex-muscle').value;

      if (weight <= 0 || reps <= 0) {
        alert('Укажите вес и количество повторений');
        return;
      }

      const entry = {
        id: Date.now(),
        date: new Date().toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' }),
        name,
        weight,
        reps,
        muscle
      };

      const logs = getLogs();
      logs.unshift(entry);
      saveLogs(logs);

      document.getElementById('ex-name').value = '';
      document.getElementById('ex-weight').value = '';
      document.getElementById('ex-reps').value = '';

      renderLogs();
      toggleMuscle(muscle, true);
    }

    function deleteLogEntry(id) {
      let logs = getLogs();
      logs = logs.filter(item => item.id !== id);
      saveLogs(logs);
      renderLogs();
    }

    function renderLogs() {
      const logs = getLogs();
      const listContainer = document.getElementById('log-list');

      if (logs.length === 0) {
        listContainer.innerHTML = '<p style="color:#666; text-align:center; font-size:14px;">История пока пуста</p>';
        return;
      }

      listContainer.innerHTML = logs.map(item => `
        <div class="log-item">
          <div class="log-info">
            <h4>${item.name} (${item.date})</h4>
            <p>${item.weight} кг × ${item.reps} повторов</p>
          </div>
          <button class="del-btn" onclick="deleteLogEntry(${item.id})">✕</button>
        </div>
      `).join('');
    }

    function toggleMuscle(muscleClass, forceActive = false) {
      const elements = document.querySelectorAll('.' + muscleClass);
      const tags = Array.from(document.querySelectorAll('.legend-tag')).filter(t => t.getAttribute('onclick').includes(muscleClass));

      elements.forEach(el => {
        if (forceActive) {
          el.classList.add('active');
        } else {
          el.classList.toggle('active');
        }
      });

      tags.forEach(t => {
        if (forceActive) {
          t.classList.add('active');
        } else {
          t.classList.toggle('active');
        }
      });
    }
  </script>
</body>
</html>
