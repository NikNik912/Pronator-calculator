<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор иконок PWA</title>
  <style>
    body { background: #121214; color: #fff; font-family: sans-serif; text-align: center; padding: 30px; }
    button { background: #ff9f0a; border: none; color: #000; padding: 16px 28px; font-size: 16px; font-weight: 800; border-radius: 12px; cursor: pointer; margin: 10px; }
  </style>
</head>
<body>
  <h2>Генератор PNG иконок</h2>
  <button onclick="generateAndDownload(192)">Скачать icon-192.png</button>
  <button onclick="generateAndDownload(512)">Скачать icon-512.png</button>
  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    function generateAndDownload(size) {
      const canvas = document.getElementById('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      // Фон
      ctx.fillStyle = '#121214';
      ctx.fillRect(0, 0, size, size);

      // Круглый контур
      ctx.fillStyle = '#1C1C1E';
      ctx.beginPath();
      ctx.arc(size/2, size/2, size * 0.41, 0, Math.PI * 2);
      ctx.fill();
      ctx.lineWidth = size * 0.024;
      ctx.strokeStyle = '#FF9F0A';
      ctx.stroke();

      // Гантель / Вес
      ctx.fillStyle = '#FF9F0A';
      ctx.fillRect(size * 0.42, size * 0.47, size * 0.16, size * 0.05); // перемычка
      ctx.fillRect(size * 0.35, size * 0.41, size * 0.07, size * 0.18); // диски
      ctx.fillRect(size * 0.58, size * 0.41, size * 0.07, size * 0.18);
      ctx.fillRect(size * 0.29, size * 0.44, size * 0.05, size * 0.12);
      ctx.fillRect(size * 0.66, size * 0.44, size * 0.05, size * 0.12);

      // Текст 1ПМ
      ctx.fillStyle = '#FFFFFF';
      ctx.font = `900 ${Math.round(size * 0.15)}px -apple-system, sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText('1ПМ', size / 2, size * 0.74);

      // Скачивание
      const link = document.createElement('a');
      link.download = `icon-${size}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
